<style>
.ac-h{font:700 26px/34px Literata,Georgia,serif;color:#0a2e1f;margin:6px 0 4px}.ac-h3{font:700 20px/28px Literata,serif;color:#0a2e1f;margin:18px 0 8px}
.ac-p{font-size:16px;line-height:24px;color:#4a4944;margin:6px 0 10px}.ac-q{font:600 19px/28px Literata,Georgia,serif;margin:8px 0 12px;color:#1c1b19}
.ac-back{border:0;background:none;color:#b3202a;font:600 15px "Source Sans 3",sans-serif;cursor:pointer;padding:6px 0}
.ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ac-list{display:grid;gap:12px;margin-top:14px}
.ac-btn{border:0;cursor:pointer;border-radius:14px;padding:13px 14px;background:#ebe6e0;color:#1c1b19;font:600 16px/22px "Source Sans 3",sans-serif;text-align:left}
.ac-btn:hover{background:#dcefe0}.ac-pri{background:#165b33;color:#fff;text-align:center}.ac-pri:hover{background:#0a2e1f}
.ac-area{display:flex;flex-direction:column;gap:4px;background:#fff;border:2px solid #e4dfd8}.ac-area .material-symbols-outlined{color:#b3202a;font-size:28px}
.ac-act{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid #e4dfd8;background:#fff;border-radius:16px;padding:14px;cursor:pointer;color:#1c1b19;text-decoration:none;box-shadow:0 2px 12px rgba(22,91,51,.08)}
.ac-act>.material-symbols-outlined{font-size:30px;color:#b3202a;flex-shrink:0}.ac-act small{color:#4a4944;font-size:14px}.ac-act:hover{border-color:#165b33}
.ac-card{background:#fff;border:1px solid #e4dfd8;border-radius:16px;padding:16px;margin:10px 0}.ac-center{text-align:center}.ac-big{font:700 44px/52px Literata,serif;letter-spacing:4px}
.ac-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.ac-row .ac-btn{flex:1;text-align:center}
.ac-mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac-card-m{min-height:84px;border:0;border-radius:12px;background:#165b33;color:#fff;font:700 22px "Source Sans 3",sans-serif;cursor:pointer;padding:6px}.ac-card-m span{font-size:14px;line-height:18px;display:block}
.ac-card-m.up{background:#fff;color:#0a2e1f;border:2px solid #d4a72c}.ac-card-m.ok{background:#dcefe0;color:#0a2e1f;border:2px solid #165b33}
.ac-pool,.ac-in{display:flex;flex-wrap:wrap;gap:8px}.ac-pool{padding:10px;background:#f6f3ef;border-radius:14px;min-height:56px}
.ac-chip{border:2px solid #d4a72c;background:#fff;border-radius:12px;padding:9px 14px;font:600 16px "Source Sans 3",sans-serif;cursor:grab}.ac-chip.sel{background:#fff3cd;box-shadow:0 0 0 3px #d4a72c}.ac-chip.done{border-color:#165b33;background:#dcefe0;cursor:default}.ac-chip.bad{background:#ffdad6;border-color:#b3202a}
.ac-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}.ac-bin{border:2px dashed #165b33;border-radius:14px;padding:10px;min-height:110px;background:#fff;cursor:pointer}.ac-bin strong{display:block;margin-bottom:8px;color:#165b33}
.ac-sopa{display:grid;gap:3px;max-width:420px;margin:8px auto}.ac-cell{aspect-ratio:1;border:0;border-radius:8px;background:#fff;border:1px solid #e4dfd8;font:700 clamp(14px,4.4vw,20px) "Source Sans 3",sans-serif;color:#1c1b19;cursor:pointer;padding:0}
.ac-cell.sel{background:#fff3cd;box-shadow:0 0 0 2px #d4a72c}.ac-cell.ok{background:#4edea3;color:#002113}
.ac-words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.ac-words span{background:#ebe6e0;border-radius:999px;padding:4px 12px;font:600 14px "Source Sans 3",sans-serif}.ac-words .got{background:#dcefe0;text-decoration:line-through;color:#4a4944}
.ac-fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:22px}.ac-fb.g{background:#dcefe0;color:#0a2e1f}.ac-fb.b{background:#ffdad6;color:#7a0e16}
.ac-opt{display:block;width:100%;margin:8px 0}
.ac-rub{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}.ac-rub caption{text-align:left;font:700 16px "Source Sans 3",sans-serif;padding:6px 0;color:#0a2e1f}
.ac-rub th{background:#165b33;color:#fff;padding:8px;text-align:left}.ac-rub td{padding:8px;border-top:1px solid #e4dfd8;vertical-align:top}.ac-rub tr.hit td{background:#fff3cd;font-weight:700}
.ac-emo{border:2px solid #e4dfd8;background:#fff;border-radius:12px;font-size:26px;padding:6px 12px;cursor:pointer}.ac-emo.sel{border-color:#d4a72c;background:#fff3cd}
.ac-l{display:block;font:600 13px "Source Sans 3",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#4a4944;margin:12px 0 4px}
.ac-card textarea,.ac-card input,.ac-card select{width:100%;border:1px solid #cfcbc3;border-radius:10px;padding:10px 12px;font:400 16px "Source Sans 3",sans-serif;background:#fff;box-sizing:border-box}
.ac-err{color:#ba1a1a;font-weight:600;min-height:20px;margin:8px 0 4px}.ac-link{border:0;background:none;color:#b3202a;text-decoration:underline;font:600 15px "Source Sans 3",sans-serif;cursor:pointer;margin-top:8px}
button:focus-visible,a:focus-visible{outline:3px solid #d4a72c;outline-offset:2px}
</style>
